<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Terminal</title>
<style>
:root{
  color-scheme:dark;
  --bg:#020b05; --g:#2dff7a; --gd:#12a84a; --red:#ff4d5e;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(ellipse at 50% 40%,#04180b,var(--bg) 70%);
  background-attachment:fixed;
  color:var(--g);
  font-family:ui-monospace,'SF Mono','Cascadia Mono',Consolas,'Courier New',monospace;
  line-height:1.6;overflow-x:hidden;
}
#bits{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.b{position:absolute;color:var(--g);opacity:0;font-weight:700;animation:up45 linear infinite;will-change:transform,opacity}
@keyframes up45{
  0%{transform:translate(0,0);opacity:0}
  10%,85%{opacity:var(--o)}
  100%{transform:translate(120vmax,-120vmax);opacity:0}
}
main{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 18px}
.term{width:100%;max-width:440px;background:rgba(2,14,7,.88);border:1px solid var(--gd);border-radius:10px;padding:22px 20px;box-shadow:0 0 28px rgba(45,255,122,.18)}
.bar{color:var(--gd);font-size:12px;margin-bottom:14px}
.ln{margin:0 0 6px;font-size:15px}
.dim{color:var(--gd)}
.cur{display:inline-block;width:.6em;height:1.1em;background:var(--g);vertical-align:text-bottom;margin-left:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.row{display:flex;align-items:center;gap:8px;margin-top:14px;border-bottom:1px solid var(--gd);padding-bottom:6px}
.row:focus-within{border-color:var(--g);box-shadow:0 6px 12px -8px var(--g)}
input{flex:1;min-width:0;font:inherit;font-size:18px;color:var(--g);background:transparent;border:0;outline:0;caret-color:var(--g);caret-shape:block;letter-spacing:.12em}
button{font:inherit;cursor:pointer}
#go{margin-top:16px;width:100%;padding:12px;font-size:16px;color:var(--bg);background:var(--g);border:0;border-radius:6px;font-weight:700}
#go:focus-visible,#back:focus-visible{outline:2px solid #fff;outline-offset:2px}
#err{min-height:24px;margin:12px 0 0;color:var(--red);font-size:14px}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
#msg{display:none;max-width:580px}
#msg p{margin:0 0 14px;font-size:15px}
#msg .end{margin-top:20px;color:#fff}
.reveal #login{display:none}
.reveal #msg{display:block}
#back{display:none;position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:14px;z-index:5;width:44px;height:44px;padding:0;border-radius:50%;background:rgba(2,14,7,.9);color:var(--g);border:1px solid var(--gd);align-items:center;justify-content:center}
.reveal #back{display:flex}
@media (prefers-reduced-motion:reduce){.b{animation:none;opacity:var(--o)}.cur{animation:none}.shake{animation:none}}
</style>
</head>
<body>
<div id="bits" aria-hidden="true"></div>
<main id="app">
  <button id="back" type="button" aria-label="Voltar para a senha"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></button>

  <section class="term" id="login">
    <div class="bar">root@secret:~$ ssh --restrito</div>
    <p class="ln">&gt; ACESSO RESTRITO</p>
    <p class="ln dim">&gt; digite a senha para continuar<span class="cur"></span></p>
    <div class="row"><span>$</span><input id="pw" type="text" style="-webkit-text-security:disc" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Senha"></div>
    <button id="go" type="button">[ ENTRAR ]</button>
    <p id="err" role="alert"></p>
  </section>

  <section class="term" id="msg" aria-live="polite">
    <div class="bar">root@secret:~$ cat mensagem.txt</div>
    <div id="typed"></div>
  </section>
</main>

<script>
(function(){
  var layer=document.getElementById('bits');
  for(var i=0;i<60;i++){
    var s=document.createElement('span');s.className='b';
    var n=1+Math.floor(Math.random()*5),t='';
    for(var k=0;k<n;k++)t+=Math.random()<.5?'0':'1';
    s.textContent=t;
    var fromLeft=Math.random()<0.4;
    s.style.left=fromLeft?'-8vw':(Math.random()*110-5)+'vw';
    s.style.top=fromLeft?(Math.random()*100)+'vh':'105vh';
    s.style.fontSize=(12+Math.random()*18)+'px';
    s.style.setProperty('--o',(0.15+Math.random()*0.3).toFixed(2));
    s.style.animationDuration=(10+Math.random()*12)+'s';
    s.style.animationDelay=(-Math.random()*22)+'s';
    layer.appendChild(s);
  }
  var pw=document.getElementById('pw'),err=document.getElementById('err'),box=document.getElementById('login');
  function norm(v){v=v.toLowerCase();if(v.normalize)v=v.normalize('NFD');return v.replace(/[^a-z]/g,'');}
  var SPEED=35; /* ms por letra */
  /* Número colado no fim de uma frase = pausa (em segundos) antes da próxima. Cada item do array é um parágrafo. */
  var MSG=[
    "Wow...3 isso foi realmente rápido...3 bom, me diz que você usou IA, fazer desafios como esse não são fáceis2 bom, de qualquer forma, tenho a certeza de que você trapaceou, portanto você não vai ver a mensagem, pode ir embora...5 vai, tá esperando o quê?5 sai daqui5 quer um cafezinho também ?5 ok ok, você venceu, mas isso não vai me convencer que você trapaceou, enfim, brincadeiras a parte, hoje é o dia das crianças, e eu realmente não queria deixar passar isso em branco, principalmente pra você, que pra mim é uma pessoa muito especial.",
    "Tenho muito para falar de você, suas características que acredito que ninguém nesse mundo tem. Você é engraçada, divertida, estudiosa, esforçada, cuidadosa, paciente ( talvez não tanto com Davi... brincadeiras hehe), e principalmente coloca Deus acima de todas as coisas, e pra mim isso é o que mais importa.",
    "Espero que no futuro possa ter inúmeras chances de escrever coisas pra você e falar o quão incrível você é, mas tudo isso se Deus quiser, pois se for de ser, será.",
    "Tomara que tenha animado um pouco mais seu dia das crianças, e que você não esqueça que você é alguém muito especial.",
    "Feliz dia das crianças! :)♥️"
  ].join('\n');
  var typed=document.getElementById('typed'),gen=0;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function stopType(){gen++;typed.innerHTML='';}
  function typeMsg(){
    var my=++gen;typed.innerHTML='';
    var parts=MSG.split(/(\d+(?:[.,]\d+)?)/),q=[],i,j,chars;
    for(i=0;i<parts.length;i++){
      if(i%2===0){chars=Array.from(parts[i]);for(j=0;j<chars.length;j++)q.push({c:chars[j]});}
      else q.push({w:parseFloat(parts[i].replace(',','.'))*1000});
    }
    var cur=document.createElement('span');cur.className='cur';
    var p=null;
    function newP(){p=document.createElement('p');typed.appendChild(p);p.appendChild(cur);}
    newP();
    function put(it){
      if(it.c==='\n'){newP();return true;}
      if(it.c===' '&&p.childNodes.length===1)return false;
      p.insertBefore(document.createTextNode(it.c),cur);return true;
    }
    if(reduce){q.forEach(function(it){if(it.c!==undefined)put(it);});return;}
    var k=0;
    function step(){
      if(my!==gen||k>=q.length)return;
      var it=q[k++];
      if(it.w!==undefined){setTimeout(step,it.w);return;}
      if(!put(it)){step();return;}
      if(cur.scrollIntoView)cur.scrollIntoView({block:'nearest'});
      setTimeout(step,SPEED+Math.random()*25);
    }
    step();
  }
  function tryOpen(){
    if(norm(pw.value)==='doce'){
      document.getElementById('app').classList.add('reveal');
      window.scrollTo(0,0);
      typeMsg();
    }else{
      err.textContent='relaxe, você consegue, tenta de novo!';
      box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');
      pw.select();
    }
  }
  document.getElementById('go').addEventListener('click',tryOpen);
  pw.addEventListener('keydown',function(e){if(e.key==='Enter')tryOpen();});
  document.getElementById('back').addEventListener('click',function(){
    document.getElementById('app').classList.remove('reveal');
    stopType();
    pw.value='';err.textContent='';window.scrollTo(0,0);
  });
})();
</script>
</body>
</html>
